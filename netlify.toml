[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist"
  functions = "netlify/functions"

# The prototype pages are plain HTML — nothing to build.
[build.environment]
  NODE_VERSION = "20"

# Clean addresses (the same as scripts/build.mjs writes to _redirects): pages served in place.
[[redirects]]
  from = "/"
  to = "/templates/stock-news-web/StockNewsWeb.dc.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/templates/stock-news-web/StockNewsWeb.dc.html"
  status = 200

# Terms, privacy policy, disclaimer and sources (templates/stock-news-web/legal.html).
[[redirects]]
  from = "/legal"
  to = "/templates/stock-news-web/legal.html"
  status = 200

# How the data is gathered and checked, and the public accuracy record (methodology.html).
[[redirects]]
  from = "/metodologie"
  to = "/templates/stock-news-web/methodology.html"
  status = 200

[[redirects]]
  from = "/methodology"
  to = "/templates/stock-news-web/methodology.html"
  status = 200

[[redirects]]
  from = "/calculator"
  to = "/templates/stock-news-web/intelligence.html"
  status = 200

# The pages' relative files, resolved from the site root.
[[redirects]]
  from = "/shared/*"
  to = "/templates/shared/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/templates/stock-news-web/assets/:splat"
  status = 200

[[redirects]]
  from = "/ds-base.js"
  to = "/templates/stock-news-web/ds-base.js"
  status = 200

[[redirects]]
  from = "/support.js"
  to = "/templates/stock-news-web/support.js"
  status = 200

[[redirects]]
  from = "/manifest.webmanifest"
  to = "/templates/stock-news-web/manifest.webmanifest"
  status = 200

# The mobile app is no longer published (scripts/build-netlify.mjs); old links land on the
# web app, which has its own phone layout.
[[redirects]]
  from = "/mobile"
  to = "/"
  status = 301

[[redirects]]
  from = "/templates/stock-news-dark/*"
  to = "/"
  status = 301


# Security headers (CSP and others) are written to dist/_headers by scripts/build-netlify.mjs,
# which takes the Supabase address from the environment.
