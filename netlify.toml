[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist"
  functions = "netlify/functions"

# The prototype pages are plain HTML — nothing to build.
[build.environment]
  NODE_VERSION = "20"

# Convenience: open the web app at the site root.
[[redirects]]
  from = "/"
  to = "/templates/stock-news-web/StockNewsWeb.dc.html"
  status = 302

[[redirects]]
  from = "/mobile"
  to = "/templates/stock-news-dark/StockNewsDark.dc.html"
  status = 302

# Security headers for every page and function response (the same policy as the
# self-hosted server, server/server.js). Nothing is loaded from other sites; the only
# outside connection is Supabase (sign-in, watchlist, summaries). The component runtime
# compiles its templates in the browser, hence 'unsafe-eval' and 'unsafe-inline'.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data: blob:; style-src 'self' 'unsafe-inline' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' data: blob: https://vadfmyqdpkddsobbmgsr.supabase.co; worker-src 'self' blob:; manifest-src 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
