[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist"
  functions = "netlify/functions"

# The prototype pages are plain HTML — nothing to build.
[build.environment]
  NODE_VERSION = "20"

# Convenience: open the web app at the site root.
[[redirects]]
  from = "/"
  to = "/templates/stock-news-web/StockNewsWeb.dc.html"
  status = 302

# The mobile app is no longer published (scripts/build-netlify.mjs); old links land on the
# web app, which has its own phone layout.
[[redirects]]
  from = "/mobile"
  to = "/templates/stock-news-web/StockNewsWeb.dc.html"
  status = 301

[[redirects]]
  from = "/templates/stock-news-dark/*"
  to = "/templates/stock-news-web/StockNewsWeb.dc.html"
  status = 301


# Security headers (CSP and others) are written to dist/_headers by scripts/build-netlify.mjs,
# which takes the Supabase address from the environment.
