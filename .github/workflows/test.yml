name: Test

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the tests need to check out the code and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The auth race test drives both templates in Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
