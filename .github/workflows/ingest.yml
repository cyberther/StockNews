name: Ingest market data

# Prices, news and analyst counts into Supabase (ingest/main.mjs), so the apps read them from
# the database instead of calling a provider per visitor.
#   intraday  every 15 minutes, staggered off the hour, 07:00-21:59 UTC on weekdays: covers
#             Bucharest's opening (07:00 or 08:00 UTC) to New York's close (20:00 or 21:00
#             UTC) in summer and winter. Each run itself only asks for markets trading or
#             just closed (templates/shared/hif-markets.js); a run with none makes no request.
#   eod       once after New York's close: closing prices, the day's press, recommendations,
#             and the official policy sources (ingest/policy/).
# Off until the repository variable INGEST_ENABLED is 'true' (Settings → Secrets and
# variables → Actions → Variables), so nothing runs before the secrets are in place.
# Started by Supabase pg_cron through GitHub's API (supabase/ingest-cron.sql): GitHub never
# started this workflow's own schedule. The times there stay in step with CRON in
# ingest/health.mjs: intraday at :07 :22 :37 :52, 07-21 UTC, weekdays; eod at 21:40 UTC.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job
        type: choice
        options: [intraday, eod, policy, impact]
        default: intraday

permissions:
  contents: read
  issues: write

# One run at a time; a run still going when the next is due is not cancelled.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JOB: ${{ inputs.job || 'intraday' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Runtime dependencies only (yahoo-finance2); no install scripts.
      - run: npm ci --omit=dev --ignore-scripts
      # pdftotext reads the policy documents (ingest/policy/documents.mjs): nightly jobs only.
      - if: env.JOB == 'eod' || env.JOB == 'policy'
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_URL: ${{ secrets.SCAN_URL }}
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
          # www.cdep.ro does not answer GitHub's runners: its pages are fetched through Supabase.
          POLICY_RELAY: supabase
        run: node ingest/main.mjs --job="$JOB"
      - name: Alert when over budget
        if: always() && hashFiles('summary.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ingest/notify.mjs --title="Ingest: over budget" --file=summary.json --field=over
      - name: Alert when the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '{"problems":["ingest '"$JOB"' run failed"]}' > failed.json
          node ingest/notify.mjs --title="Ingest: run failed" --file=failed.json --field=problems
